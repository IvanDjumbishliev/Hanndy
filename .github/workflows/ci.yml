name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd hand-gesture-app && npm ci
      - run: cd hand-gesture-app && npx tsc --noEmit
      - run: cd hand-gesture-app && npm run build
